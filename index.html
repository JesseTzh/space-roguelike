<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Space Roguelike MVP</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        overflow: hidden;
        height: 100%;
        width: 100%;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #orientation-hint {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        z-index: 9999;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: landscape) and (max-width: 900px) {
        #orientation-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="orientation-hint">建议竖屏游玩 / Please rotate to portrait</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
