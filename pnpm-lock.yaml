# This placeholder is included because the execution environment cannot access the npm registry.
# Generate the real lockfile in a networked environment with:
#   corepack enable
#   corepack prepare pnpm@11.4.0 --activate
#   pnpm install --frozen-lockfile
lockfileVersion: '9.0'
settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false
importers:
  .:
    dependencies:
      phaser:
        specifier: 4.1.0
        version: 4.1.0
    devDependencies:
      '@playwright/test':
        specifier: 1.60.0
        version: 1.60.0
      '@vitest/coverage-v8':
        specifier: 4.1.7
        version: 4.1.7
      jsdom:
        specifier: 29.1.1
        version: 29.1.1
      typescript:
        specifier: 6.0.3
        version: 6.0.3
      vite:
        specifier: 8.0.14
        version: 8.0.14
      vitest:
        specifier: 4.1.7
        version: 4.1.7
